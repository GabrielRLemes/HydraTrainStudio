name: Desktop smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow av requests psutil numpy pyyaml nvidia-ml-py keyring
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk && xvfb-run -a python release/smoke.py
      - if: runner.os == 'Windows'
        run: python release/smoke.py
