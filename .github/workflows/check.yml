name: Desktop smoke
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install bandit==1.8.6
      - run: python -m bandit -r app release --severity-level high --confidence-level medium --quiet
      - run: bash -n release/linux.sh.in && bash -n abrir-linux.sh
  smoke:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow av requests psutil numpy pyyaml nvidia-ml-py keyring
      - run: python -B release/security_checks.py
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk && xvfb-run -a python release/smoke.py
      - if: runner.os == 'Windows'
        run: python release/smoke.py
