name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: python release/build.py
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag "${flags[@]}" --notes-file release/NOTAS.md --title "HydraTrainStudio $GITHUB_REF_NAME"
