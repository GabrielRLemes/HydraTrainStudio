name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  package:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python release/build.py
      - name: Install in a clean Windows user folder and launch from the shortcut
        shell: powershell
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        timeout-minutes: 15
        run: ./release/windows_install_check.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: verified-packages
          path: dist/
          retention-days: 1
  linux-install:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-packages
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv xvfb xauth xdotool desktop-file-utils libglib2.0-bin
      - run: xvfb-run -a /usr/bin/python3 release/linux_install_check.py
        timeout-minutes: 12
  publish:
    needs: linux-install
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-packages
          path: dist
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag "${flags[@]}" --notes-file release/NOTAS.md --title "HydraTrainStudio $GITHUB_REF_NAME"
